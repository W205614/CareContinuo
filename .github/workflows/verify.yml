name: Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: carecontinuo-ci
      COMPOSE_FILE: compose.yaml:compose.verify.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
      - run: ./mvnw -B verify
      - run: uv run --locked python -m pytest
        working-directory: agent
      - run: npm ci --no-audit --no-fund && npm run check && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose up --build --wait --wait-timeout 120
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
