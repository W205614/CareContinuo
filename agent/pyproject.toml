[project]
name = "carecontinuo-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
