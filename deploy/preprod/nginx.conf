resolver 127.0.0.11 valid=3s ipv6=off;
limit_req_zone $binary_remote_addr zone=logins:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=uploads:1m;

upstream care_api {
    zone care_api 64k;
    server api:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 8443 ssl;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    client_body_timeout 15s;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $request_id always;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /api/v1/session/login {
        limit_req zone=logins burst=25 nodelay;
        limit_req_status 429;
        proxy_pass http://care_api;
    }

    location ~ ^/api/v1/episodes/[0-9]+/documents$ {
        limit_conn uploads 4;
        limit_conn_status 429;
        proxy_pass http://care_api;
    }

    location /api/ { proxy_pass http://care_api; }
    location = /oauth2/authorization/hospital { proxy_pass http://care_api; }
    location = /login/oauth2/code/hospital { proxy_pass http://care_api; }
    location = /actuator { return 404; }
    location /actuator/ { return 404; }
    location ~ ^/id/(resources/|realms/care/) {
        set $keycloak http://idp:8080;
        proxy_pass $keycloak;
    }
    location /id/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
