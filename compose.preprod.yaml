name: carecontinuo-preprod

x-app: &app
  image: ${CARE_PREPROD_API_IMAGE:-carecontinuo-preprod-api:local}
  environment: &app-env
    SPRING_PROFILES_ACTIVE: preprod
    CARE_DB_URL: jdbc:postgresql://postgres:5432/care_preprod
    CARE_DB_USER: care_app
    CARE_PREPROD_ORIGIN: ${CARE_PREPROD_ORIGIN:?Run deploy/preprod/prepare.py}
    CARE_OIDC_ISSUER: ${CARE_PREPROD_ORIGIN}/id/realms/care
    CARE_OIDC_BACKCHANNEL: http://idp:8080/id/realms/care
    CARE_OIDC_ACR: "2"
    CARE_AGENT_URL: http://agent:8000
    CARE_AGENT_ENABLED: "true"
    CARE_SYNTHETIC_DISCHARGES_ENABLED: "true"
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [data]
  mem_limit: 1536m
  cpus: 2
  restart: unless-stopped
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:8081/actuator/health/readiness]
    interval: 4s
    timeout: 3s
    start_period: 20s
    retries: 20

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: care_preprod
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/preprod/init-db.sh:/docker-entrypoint-initdb.d/10-care.sh:ro
    secrets: [postgres_password, migrator_password, application_password]
    networks: [data]
    labels:
      app.carecontinuo.preprod: "synthetic"
    mem_limit: 4096m
    cpus: 4
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -d care_preprod -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ${CARE_PREPROD_API_IMAGE:-carecontinuo-preprod-api:local}
    entrypoint: [java, -jar, /app/carecontinuo.jar]
    command: ["--spring.main.web-application-type=none", "--care.lifecycle.once=true"]
    environment:
      CARE_DB_URL: jdbc:postgresql://postgres:5432/care_preprod
      CARE_DB_USER: care_migrator
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: migrator_password
        target: spring.datasource.password
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  idp:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_HTTP_RELATIVE_PATH: /id
      KC_HOSTNAME: ${CARE_PREPROD_ORIGIN}/id
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ${CARE_PREPROD_SECRETS:?Run deploy/preprod/prepare.py}/realm.json:/opt/keycloak/data/import/care-realm.json:ro
    networks: [identity]
    mem_limit: 1536m
    cpus: 2

  api:
    <<: *app
    build: .
    scale: 2
    networks: [data, browser, identity]
    secrets:
      - source: application_password
        target: spring.datasource.password
      - care_oidc_client_secret

  worker:
    <<: *app
    scale: 2
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: preprod,worker
      CARE_JOBS_ENABLED: "true"
      CARE_AGENT_KEY_FILE: /run/secrets/agent_key
      SPRING_SESSION_JDBC_CLEANUP_CRON: "-"
    secrets:
      - source: application_password
        target: spring.datasource.password
      - agent_key
    networks: [data, model]

  agent:
    build: ./agent
    image: ${CARE_PREPROD_AGENT_IMAGE:-carecontinuo-preprod-agent:local}
    command: [".venv/bin/uvicorn", "model_fixture:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ./agent/tests/model_fixture.py:/app/model_fixture.py:ro
    environment:
      CARE_AGENT_KEY_FILE: /run/secrets/agent_key
    secrets: [agent_key]
    networks: [model]

  web:
    build: ./web
    image: ${CARE_PREPROD_WEB_IMAGE:-carecontinuo-preprod-web:local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CARE_PREPROD_PORT:-18443}:8443"
    volumes:
      - ./deploy/preprod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_cert, tls_key]
    networks: [browser, identity]
    labels:
      app.carecontinuo.preprod: "synthetic"
    restart: unless-stopped

networks:
  data:
    internal: true
    ipam:
      config: [{subnet: "${CARE_PREPROD_SUBNET_PREFIX:-10.203.200}.0/27"}]
  browser:
    ipam:
      config: [{subnet: "${CARE_PREPROD_SUBNET_PREFIX:-10.203.200}.32/27"}]
  model:
    internal: true
    ipam:
      config: [{subnet: "${CARE_PREPROD_SUBNET_PREFIX:-10.203.200}.64/27"}]
  identity:
    internal: true
    ipam:
      config: [{subnet: "${CARE_PREPROD_SUBNET_PREFIX:-10.203.200}.96/27"}]

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ${CARE_PREPROD_SECRETS}/postgres_password
  migrator_password:
    file: ${CARE_PREPROD_SECRETS}/migrator_password
  application_password:
    file: ${CARE_PREPROD_SECRETS}/application_password
  care_oidc_client_secret:
    file: ${CARE_PREPROD_SECRETS}/care_oidc_client_secret
  agent_key:
    file: ${CARE_PREPROD_SECRETS}/agent_key
  tls_cert:
    file: ${CARE_PREPROD_SECRETS}/tls_cert.pem
  tls_key:
    file: ${CARE_PREPROD_SECRETS}/tls_key.pem
