name: carecontinuo
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: carecontinuo
      POSTGRES_USER: carecontinuo
      POSTGRES_PASSWORD: ${CARE_DB_PASSWORD:-local-demo-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, carecontinuo, -d, carecontinuo]
      interval: 3s
      timeout: 3s
      retries: 20
  agent:
    build: ./agent
    networks: [model]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 4s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      CARE_DB_URL: jdbc:postgresql://postgres:5432/carecontinuo
      CARE_DB_USER: carecontinuo
      CARE_DB_PASSWORD: ${CARE_DB_PASSWORD:-local-demo-db}
      CARE_DEMO_PASSWORD: ${CARE_DEMO_PASSWORD:-demo-care-2026}
    networks: [data, model, browser]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/api/v1/status]
      interval: 4s
      timeout: 3s
      retries: 20
      start_period: 10s
  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CARE_WEB_PORT:-18080}:80"
    networks: [browser]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/v1/status]
      interval: 4s
      timeout: 3s
      retries: 15

networks:
  data:
    internal: true
  model: {}
  browser: {}

volumes:
  pgdata:
